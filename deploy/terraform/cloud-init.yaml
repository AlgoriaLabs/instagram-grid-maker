#cloud-config
# First boot of the VM: Docker and Compose, a swap file (builds on a 1 GB Micro VM need it), ports 80 and 443 opened in
# the host firewall (Oracle's Ubuntu images reject everything but SSH), and the app folder. deploy.sh does the rest.

package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - rsync
  - iptables-persistent

runcmd:
  - [sh, -c, "fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab"]
  - [sh, -c, "iptables -I INPUT 5 -p tcp --dport 80 -m state --state NEW -j ACCEPT"]
  - [sh, -c, "iptables -I INPUT 5 -p tcp --dport 443 -m state --state NEW -j ACCEPT"]
  - [sh, -c, "netfilter-persistent save"]
  - [systemctl, enable, --now, docker]
  - [usermod, -aG, docker, ubuntu]
  - [sh, -c, "mkdir -p /opt/grid-maker && chown ubuntu:ubuntu /opt/grid-maker"]
  - [sh, -c, "echo ready > /opt/grid-maker/.cloud-init-done"]
